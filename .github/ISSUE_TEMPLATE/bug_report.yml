name: Bug report
description: Something in Pancho is not working as expected
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much detail as you can.
        If this is a **security** issue, do not use this form —
        report it privately via [Security Advisories](https://github.com/undaniel/pancho/security/advisories/new).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a file with ...
        2. Select ...
        3. Run command ...
        4. See ...
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Sample input (if relevant)
      description: Paste the text/markup you were processing.
      render: text
    validations:
      required: false

  - type: input
    id: pancho-version
    attributes:
      label: Pancho version
      description: 'Shown in the Extensions view, or run "Pancho: Show logs".'
      placeholder: e.g. 1.3.0
    validations:
      required: true

  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      placeholder: e.g. 1.90.0
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Where does it run?
      options:
        - Desktop
        - Web (vscode.dev / github.dev)
        - Remote / WSL / Dev Container
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: 'Run "Pancho: Show logs" and paste anything relevant.'
      render: text
    validations:
      required: false
